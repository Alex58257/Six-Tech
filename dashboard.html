<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SixTech | Panel principal</title>
    <link rel="stylesheet" href="dashboard.css">
</head>
<body>
    <header class="topbar">
        <div class="brand">
            <div class="logo">
                <img src="logo.jpg" alt="Logo de Six-Tech">
            </div>

            <div>
                <h1>SixTech</h1>
                <p>Sistema de Inventario y Ventas</p>
            </div>
        </div>

        <div class="user-menu">
            <button
            type="button"
            class="user-menu-button"
            id="menuButton"
            aria-expanded="false"
            aria-controls="menuDropdown">
            <span class="user-icon">👤</span>
            <span>Mi cuenta</span>
            <span class="menu-arrow">▾</span>
        </button>
        <div class="menuDropdown" id="menuDropdown" hidden>
            <button
            type="button"
            class="logout-button"
            onclick="cerrarSesion()">
            ↪Cerrar sesión</button>
        </div>
        </div>
    </header>

    <main class="dashboard-container">

        <section class="welcome">
            <h2>Panel principal</h2>
            <p>¡Hola! ¿Qué deseas hacer hoy?</p>
        </section>

        <section class="modules">

            <button 
                type="button"
                class ="module-card-products"
                onclick="window.location.href='productos.html'">

                <span class="module-icon">📦</span>
                <h3>Productos</h3>
                <p>Consultar y registrar productos</p>
                <span class="module-link">Abir módulo</span>
            </button>

            <button 
                type="button"
                class="module-card-sales" 
                onclick="window.location.href='ventas.html'">
                <span class="module-icon">🛒</span>
                <h3>Ventas</h3>
                <p>Registrar una nueva venta</p>
                <span class="module-link">Abrir módulo</span>
            </button>

            <button 
                type="button"
                class="module-card-movements" 
                onclick="window.location.href='movimientos.html'">
                <span class="module-icon">📄</span>
                <h3>Movimientos</h3>
                <p>Consultar entradas y salidas</p>
                <span class="module-link">Abrir módulo</span>
            </button>

            <button 
                type="button"
                class="module-card-reports" 
                onclick="window.location.href='reportes.html'">
                <span class="module-icon">📊</span>
                <h3>Reportes</h3>
                <p>Consultar Ventas e Inventario</p>
                <span class="module-link">Abrir módulo</span>
            </button>
        </section>
        <p id="mensaje" role="status" aria-live="polite"></p>
    </main>

    <footer>
        <p>©️ SixTech 2026 | Sistema de gestión</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth-guard.js"></script>
    <script src="dashboard.js"></script>
</body>
</html>
